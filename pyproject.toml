[project]
name = "philidor"
version = "1.0.0"
description = "Philidor's Analysis of the Game of Chess, transcribed from the 1777 scan and converted to algebraic notation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # The board. Every reading of a move is checked against it.
    "chess>=1.11",
    # Reads and rewrites the Quarto book's _quarto.yml.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed to re-extract philidor1.txt from the 1790 scan, which is already
# committed. The scans themselves are not in the repository.
scans = ["pypdf>=5.0"]
# Only needed to screenshot the rendered book while working on its styling.
dev = ["playwright>=1.40"]

[tool.uv]
package = false
